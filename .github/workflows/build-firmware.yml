name: Build firmware

# Builds only the board(s) whose files changed:
#   - a change to boards/<board>.h  -> build just that board
#   - a change to the shared keyboard-dongle.ino (or this workflow) -> build all
# Refreshed bins are committed back into web/<board>/. collect-bins.ps1 still works
# locally. Manual run (workflow_dispatch) builds all.

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'firmware/keyboard-dongle/keyboard-dongle.ino'
              - '.github/workflows/build-firmware.yml'
            lilygo:
              - 'firmware/keyboard-dongle/boards/lilygo.h'
            geek:
              - 'firmware/keyboard-dongle/boards/geek.h'
            atoms3u:
              - 'firmware/keyboard-dongle/boards/atoms3u.h'
            atoms3u_gamepad:
              - 'firmware/keyboard-dongle/boards/atoms3u.h'

      - name: Decide which boards to build
        id: pick
        run: |
          if [ "${{ steps.filter.outputs.shared }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            B="lilygo geek atoms3u atoms3u-gamepad"
          else
            B=""
            [ "${{ steps.filter.outputs.lilygo }}"  = "true" ] && B="$B lilygo"
            [ "${{ steps.filter.outputs.geek }}"    = "true" ] && B="$B geek"
            [ "${{ steps.filter.outputs.atoms3u }}" = "true" ] && B="$B atoms3u"
            [ "${{ steps.filter.outputs.atoms3u_gamepad }}" = "true" ] && B="$B atoms3u-gamepad"
          fi
          B=$(echo $B | xargs)
          echo "boards=$B" >> "$GITHUB_OUTPUT"
          echo "Building: [$B]"

      - name: Cache arduino15
        if: steps.pick.outputs.boards != ''
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ hashFiles('.github/workflows/build-firmware.yml') }}

      - name: Install arduino-cli + ESP32 core + libraries
        if: steps.pick.outputs.boards != ''
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library"

      - name: Build selected boards
        if: steps.pick.outputs.boards != ''
        run: |
          set -e
          F16="esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,PartitionScheme=app3M_fat9M_16MB,FlashSize=16M"
          F8="esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,PartitionScheme=default_8MB,FlashSize=8M"
          BOOT=$(find "$HOME/.arduino15/packages/esp32" -name boot_app0.bin | head -1)
          id_of()   { case $1 in lilygo) echo 1;; geek) echo 2;; atoms3u) echo 3;; atoms3u-gamepad) echo 4;; esac; }
          fqbn_of() { case $1 in atoms3u|atoms3u-gamepad) echo "$F8";; *) echo "$F16";; esac; }
          for name in ${{ steps.pick.outputs.boards }}; do
            echo "::group::build $name"
            arduino-cli compile --fqbn "$(fqbn_of $name)" \
              --build-property "compiler.cpp.extra_flags=-DBOARD=$(id_of $name)" \
              --output-dir "build/$name" firmware/keyboard-dongle
            mkdir -p "web/$name"
            cp build/$name/*.ino.bin            "web/$name/firmware.bin"
            cp build/$name/*.ino.bootloader.bin "web/$name/bootloader.bin"
            cp build/$name/*.ino.partitions.bin "web/$name/partitions.bin"
            cp "$BOOT"                           "web/$name/boot_app0.bin"
            echo "::endgroup::"
          done

      - name: Commit refreshed bins
        if: steps.pick.outputs.boards != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/*/*.bin
          if git diff --cached --quiet; then
            echo "bins unchanged"
          else
            git commit -m "ci: rebuild firmware bins [skip ci]"
            git push
          fi
